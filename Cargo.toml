[package]
name = "osrs-random"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["stackrot <dev@stackrot.dev>"]
description = "A random boss and skill generator for Old School RuneScape"
repository = "https://github.com/stackrot/osrs-random"
license = "MIT"

[dependencies]
anyhow = "1.0"
rand = "0.10"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
scraper = { version = "0.27", default-features = false }
self-replace = "1.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
