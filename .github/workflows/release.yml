name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Choose release tag
        id: release
        run: echo "tag=v$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: osrs-random
            asset: osrs-random-linux.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: osrs-random.exe
            asset: osrs-random-windows.zip
    runs-on: ${{ matrix.os }}
    env:
      OSRS_RANDOM_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and check binary
        shell: python
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          import os
          import pathlib
          import subprocess
          import zipfile

          binary = pathlib.Path("target") / os.environ["BUILD_TARGET"] / "release" / os.environ["BINARY_NAME"]
          version = subprocess.check_output([str(binary), "version"], text=True)
          assert os.environ["OSRS_RANDOM_RELEASE_TAG"] in version, version
          subprocess.run([str(binary), "--offline", "skill"], check=True)
          subprocess.run([str(binary), "--offline", "boss"], check=True)
          with zipfile.ZipFile(os.environ["ASSET_NAME"], "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(binary, binary.name)
              archive.write("LICENSE")
              archive.write("data/README.md", "DATA-SOURCES.md")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: osrs-random-*.zip
          merge-multiple: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$COMMIT_SHA" \
            --title "Release $RELEASE_TAG" \
            --notes "Automatic build for commit $COMMIT_SHA." \
            --draft osrs-random-linux.zip osrs-random-windows.zip
          gh release edit "$RELEASE_TAG" --draft=false --latest
